name: Maven CI Tests and Coverage

# Controls when the workflow will run on any branch
on:
  push:
    branches:
      - main
  pull_request:

# Allows Coverage to be written back as a PR comment
permissions:
  pull-requests: write

# Define the jobs for this workflow
jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 11
        uses: actions/setup-java@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Run tests with coverage
        run: mvn -B clean verify

      - name: Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          directory: .
          files: |
            fdc3-agent-proxy/target/site/jacoco/jacoco.xml
            fdc3-get-agent/target/site/jacoco/jacoco.xml
            fdc3-context/target/site/jacoco/jacoco.xml
